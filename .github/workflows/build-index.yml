name: Build catalog

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["sources/**", "workflow.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data/index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_BRANCH: ${{ github.ref_name }}
        run: python ./workflow.py build
      - name: Commit changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch index.json state.json
          git add -A data icons sources
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update catalog"
          # A submission may have been merged while the build was running.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push the catalog update"
          exit 1
